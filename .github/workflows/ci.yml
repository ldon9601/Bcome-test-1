# Checks every change before it can go live: unit tests and data checks, a full production build
# with type checking, lint, and the database migrations and security checks on a real Postgres.
#
# To stop a failing change reaching the live site, add these four checks as Vercel Deployment
# Checks (Vercel project > Settings > Build and Deployment > Deployment Checks > Add Checks >
# GitHub): "Unit tests", "Build and typecheck", "Lint", "Database checks".
# Vercel then holds each new production deployment until they pass. See README > Checks.
#
# Changes pushed by other workflows (the weekly data refresh, the first-run lockfile) don't start
# workflows on their own, so those workflows run this one explicitly with `gh workflow run`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to a branch or pull request cancels the older run there; on the default branch every
# commit is a production deployment that needs its own result, so runs there are never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test
      - name: Data refresh script tests
        run: npm run -s test:refresh
      - name: Validate the data in /data
        run: npm run -s data:validate
      - name: Run the sample students through the whole pipeline
        run: npm run -s test:profiles
      - name: Check supabase/seed.sql is up to date with /data
        run: |
          npm run -s db:seed-sql
          git diff --quiet -- supabase/seed.sql || { echo "::error::supabase/seed.sql is out of date. Run npm run db:seed-sql and commit it."; git diff --stat -- supabase/seed.sql; exit 1; }

  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # first run only: commits package-lock.json
      actions: write # first run only: re-runs this workflow on that commit
    env:
      # Placeholders so the production build can start; nothing connects to them.
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret-0001
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      APP_URL: https://ci.bcome.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
            echo "new_lockfile=false" >> "$GITHUB_OUTPUT"
          else
            npm install --no-audit --no-fund
            echo "new_lockfile=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Production build
        run: npm run build
      - name: Typecheck (app, scripts and tests)
        run: npm run typecheck
      - name: Commit the lockfile (first run only)
        if: steps.install.outputs.new_lockfile == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock package versions (package-lock.json)" -m "Generated by CI from package.json so every install uses the same versions."
          git push origin HEAD:${{ github.ref_name }}
          gh workflow run ci.yml --ref "${{ github.ref_name }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: ESLint (Next.js rules)
        run: npm run lint

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run every migration on an empty database, then the seed
        run: |
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -c "create database bcome"
          $P -d bcome -f supabase/tests/local-auth-stub.sql
          for f in supabase/migrations/*.sql; do echo "-- $f"; $P -d bcome -f "$f"; done
          $P -d bcome -f supabase/seed.sql
      - name: Constraint and access checks (row level security, roles, retention)
        run: |
          : > results.txt
          for t in accounts activity admin; do
            psql -v ON_ERROR_STOP=1 -q -t -d bcome -f "supabase/tests/$t-checks.sql" | sed '/^\s*$/d' | tee -a results.txt
          done
          passed=$(grep -c '^ *PASS' results.txt || true)
          failed=$(grep -c '^ *FAIL' results.txt || true)
          echo "### Database checks: $passed passed, $failed failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] && [ "$passed" -ge 42 ]
