# Keeps package-lock.json in step with package.json. When package.json changes on main (a new
# package, a version change or an override), this regenerates the lock file, commits it and runs
# the CI checks on that commit. Also runs on demand: Actions > Update lockfile > Run workflow.
name: Update lockfile

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # starts CI on the commit this workflow pushes

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Resolve package.json into package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json to match package.json"
          git push origin HEAD:${{ github.ref_name }}
          gh workflow run ci.yml --ref "${{ github.ref_name }}"
